# Releases the plugin when a version tag such as 1.1.0 is pushed. Only
# administrators can create those tags, and no one can move or delete them.
#
# build lints the tagged commit and builds the package with a read-only token
# and no secret. release runs in the `release` environment, which needs an
# owner's approval: it records a build provenance attestation for the package
# and publishes the release with the package attached. Releases are immutable,
# so from then on neither the tag nor the release can change.
#
# The tag must equal the version in the plugin header, in
# EmpirioLabsProvider::VERSION and in the readme's stable tag, and readme.txt
# must have a changelog section for it (bin/package.sh checks all four).

name: Release

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build the package from the tagged commit
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint every PHP file with the runner's PHP
        run: |
          set -euo pipefail
          find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n 1 php -l

      - name: Lint every PHP file with PHP 7.4
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/plugin:ro" \
            php:7.4-cli-alpine@sha256:0d67d81f60f4a400f1b68e3a41e910c98c5e08f49e515f6855561a0f24d37852 \
            sh -c 'find /plugin -name "*.php" -not -path "/plugin/.git/*" -print0 | xargs -0 -n 1 php -l'

      - name: Build the package and check it against the tag
        env:
          TAG: ${{ github.ref_name }}
        run: bin/package.sh "$RUNNER_TEMP/release" "$TAG"

      - name: Upload the package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 7

  release:
    name: Attest and publish the release
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # create the release
      id-token: write # sign the provenance attestation
      attestations: write # store it
    steps:
      - name: Download the package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release

      - name: Attest the package
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/empiriolabs-ai-provider.zip

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/notes.md"
          {
            cat release/notes.md
            echo
            echo "To install, download \`empiriolabs-ai-provider.zip\` below. In WordPress, open **Plugins > Add Plugin > Upload Plugin**, choose the file, and activate the plugin. Then add your API key under **Settings > Connectors**."
            echo
            echo "Verify the package with \`gh attestation verify empiriolabs-ai-provider.zip --repo ${GITHUB_REPOSITORY}\`."
          } >"$notes"
          gh release create "$TAG" release/empiriolabs-ai-provider.zip --repo "$GITHUB_REPOSITORY" --verify-tag --title "EmpirioLabs AI Provider ${TAG}" --notes-file "$notes"
